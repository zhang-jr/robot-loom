# Robot Loom workspace configuration.
#
# This file is copied to ~/.robot-loom/workspace/config.yaml by `robot-loom init`.
# Edit it to point at your Brain model, fleet, and safety envelope.
#
# Secrets (API keys, tokens) MUST live in `.env`, NOT here.
# This file is meant to be tracked in git; `.env` is not.

# ---------------------------------------------------------------------------
# Brain — LLM/VLM backend used for planning and tool calling.
# `model` is any LiteLLM-compatible string:
#   openai/gpt-4o            (needs OPENAI_API_KEY)
#   anthropic/claude-sonnet-4-6
#                            (needs ANTHROPIC_API_KEY)
#   ollama/qwen2.5:14b       (needs OLLAMA_API_BASE, default http://localhost:11434)
#   hosted_vllm/<model>      (needs api_base pointing at your vLLM server)
# ---------------------------------------------------------------------------
brain:
  model: openai/gpt-4o
  temperature: 0.0
  max_tokens: 4096
  timeout_s: 60.0
  max_replan_iterations: 5
  # api_base: http://localhost:8000/v1   # uncomment for local vLLM / proxy
  api_key_env: OPENAI_API_KEY            # name of the env var holding the key

# ---------------------------------------------------------------------------
# Tool middleware defaults.
#
# default_middleware declares the chain applied to every registered tool.
# Entries are applied outermost-first (first entry wraps everything beneath).
# Supported types: trace | timeout | retry | cancel | circuit_breaker | cache | rate_limit
# Each entry may include a `params` map forwarded to the middleware constructor.
# ---------------------------------------------------------------------------
tool:
  default_timeout_s: 30.0
  max_retries: 3
  retry_backoff_base_s: 1.0
  default_middleware:
    - type: trace
    - type: timeout
    - type: retry
      params:
        max_retries: 3
        backoff_base_s: 1.0
    - type: circuit_breaker
      params:
        failure_threshold: 5
        reset_timeout_s: 30.0

# ---------------------------------------------------------------------------
# Safety envelope (ADR-007). Never disable in production.
# ---------------------------------------------------------------------------
safety:
  enabled: true
  max_joint_velocity_rad_s: 1.0
  workspace_bounds_m: [-2.0, -2.0, 0.0, 2.0, 2.0, 2.0]   # [xmin ymin zmin xmax ymax zmax]

# ---------------------------------------------------------------------------
# Observability.
# ---------------------------------------------------------------------------
observability:
  trace_sink: stderr            # stderr | file
  trace_file: ""                # used when trace_sink == "file"
  otel_endpoint: ""             # OTLP/HTTP collector — set to enable OTel spans
                                # Langfuse:  https://<host>/api/public/otel
                                # Jaeger:    http://localhost:4318/v1/traces

# ---------------------------------------------------------------------------
# Fleet. Single robot is fleet_size: 1 with one entry in robot_ids.
# ---------------------------------------------------------------------------
fleet_size: 1
robot_ids:
  - robot-0
