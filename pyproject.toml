[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_harness"]

[project]
name = "robot-loom"
version = "0.1.0"
description = "Model- and embodiment-agnostic robot agent orchestration harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
    "msgpack>=1.0.8",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.12",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
# Deps to RUN the bundled reference sim server
# (examples/sim_servers/mujoco_agent_server.py), NOT for the harness to use a
# sim. The harness↔sim boundary is pure HTTP (ADR-001 / ADR-021), so the harness
# itself needs only httpx (a core dep) to drive a sim — exactly as for real
# hardware. A real robot's heavy deps (ROS 2, vendor SDK, drivers) likewise live
# in its per-robot agent_server, not here; there is therefore no [hardware]
# extra. If a native ROS 2 / DDS adapter ever lands in embodiment/interface/, it
# gets its own [ros2] extra at that point (ADR-016).
sim-ref = [
    "mujoco>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pillow>=10.0.0",
]

[project.scripts]
robot-loom = "robot_harness.cli:main"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["robot_harness", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names)
    "I",     # isort
    "N",     # pep8-naming (class/function/variable naming)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear (common bugs)
    "T20",   # flake8-print (ban print())
    "BLE",   # flake8-blind-except (ban bare Exception catch)
    "ASYNC", # flake8-async (async best practices)
    "RUF",   # ruff-native rules
]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "B008",   # function calls in default argument — common in FastAPI-style patterns
]

[tool.ruff.lint.isort]
known-first-party = ["robot_harness"]
# stdlib → third-party → first-party, blank line between sections
force-sort-within-sections = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "BLE001",  # broad exception catch is acceptable in test helpers
]
"examples/**/*.py" = [
    "T201",    # print() allowed in runnable examples
]
"robot_harness/skill/manifest_validator.py" = [
    "T201",    # CLI tool — print() to stdout/stderr is intentional
]
"robot_harness/channels/cli.py" = [
    "T201",    # CLI channel writes to stdout/stderr by design
]
"robot_harness/observability/metrics.py" = [
    "T201",    # startup banner printed to stderr is intentional
]
"robot_harness/tools/generic/fs.py" = [
    "ASYNC",  # pathlib in asyncio context is fine here — project uses asyncio not trio/anyio
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "robot_harness"

# --- strict mode flags (equivalent to --strict) ---
strict = true

# --- extra strictness beyond --strict ---
warn_unreachable = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_unimported = true
disallow_any_expr = false          # too noisy for Protocol-heavy code
disallow_any_decorated = false     # LiteLLM / OTel decorators use Any internally
disallow_any_explicit = false      # allows explicit Any for adapter escape hatches
# --- import handling ---
# Each third-party stub package should be listed here when stubs are available.
# Unknown imports are silently ignored per module below.
follow_imports = "normal"
follow_imports_for_stubs = true

# --- reporting ---
show_error_codes = true
show_column_numbers = true
pretty = true
error_summary = true

# --- per-module overrides ---
[[tool.mypy.overrides]]
# Third-party packages without stubs
module = [
    "litellm.*",
    "mcp.*",
    "msgpack.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fastapi is an optional extra — only present when installed
module = ["fastapi", "fastapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: relax some strict checks for fixtures / broad catches
module = ["tests.*"]
disallow_untyped_defs = true
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# Examples: allow untyped defs for runnable scripts
module = ["examples.*"]
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
# metrics.py uses conditional imports; type: ignore comments are needed for
# mypy 1.20+ but flagged unused by mypy 1.10 (pre-commit pin).
module = ["robot_harness.observability.metrics"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# web channel uses fastapi (optional dep) — relax strict checks.
# warn_unused_ignores=false because mypy 1.10 uses [misc] and 1.20+ uses
# [untyped-decorator] for the same error; keeping both codes avoids breakage
# when the pre-commit hook mypy version diverges from the local one.
module = ["robot_harness.channels.web"]
disallow_untyped_defs = false
warn_return_any = false
disallow_any_unimported = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# mcp SDK ships no type stubs; ClientSession / CallToolResult / ListToolsResult
# all become Any.  disallow_any_unimported is relaxed only for this thin
# adapter — all callers outside tools/mcp/ still see typed ToolResult.
module = ["robot_harness.tools.mcp.client"]
disallow_any_unimported = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "hardware: tests that require real robot hardware (skip with '-m not hardware')",
]
testpaths = ["tests"]
