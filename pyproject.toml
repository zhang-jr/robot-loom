[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-loom"
version = "0.1.0"
description = "Model- and embodiment-agnostic robot agent orchestration harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
    "msgpack>=1.0.8",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
robot-loom = "robot_harness.cli:main"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["robot_harness", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names)
    "I",     # isort
    "N",     # pep8-naming (class/function/variable naming)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear (common bugs)
    "T20",   # flake8-print (ban print())
    "BLE",   # flake8-blind-except (ban bare Exception catch)
    "ASYNC", # flake8-async (async best practices)
    "RUF",   # ruff-native rules
]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "B008",   # function calls in default argument — common in FastAPI-style patterns
]

[tool.ruff.lint.isort]
known-first-party = ["robot_harness"]
# stdlib → third-party → first-party, blank line between sections
force-sort-within-sections = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "BLE001",  # broad exception catch is acceptable in test helpers
]
"examples/**/*.py" = [
    "T201",    # print() allowed in runnable examples
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "hardware: tests that require real robot hardware (skip with '-m not hardware')",
]
testpaths = ["tests"]
